<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuhoWise - Current Focus</title>
    <meta http-equiv="refresh" content="0; url=subjects.html">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="buhowise-fixes.css" rel="stylesheet">
    <style>
        :root { 
            --primary: #6B4EFF; 
            --primary-dark: #5537e6; 
            --light-purple: #F5F2FF; 
            --dark: #2D2D35; 
            --bg-light: #fdfdfd; 
            --card-border: #ece8ff; 
            --nav-footer-dark: #1a1824; 
        }

        body { 
            min-height: 100vh; 
            display: grid; 
            place-items: center; 
            background: linear-gradient(180deg, var(--light-purple), var(--bg-light)); 
            color: var(--dark); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        .focus-card { 
            max-width: 620px; 
            margin: 24px; 
            padding: 34px; 
            border-radius: 22px; 
            border: 1px solid var(--card-border); 
            background: var(--bg-light); 
            box-shadow: 0 18px 40px rgba(107,78,255,.14); 
            text-align: center; 
        }

        .focus-icon { 
            width: 70px; 
            height: 70px; 
            border-radius: 20px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            background: var(--primary); 
            color: white; font-size: 2rem; 
            margin-bottom: 18px; 
        }

        .btn-main { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            margin-top: 12px; 
            padding: 12px 18px; 
            border-radius: 999px; 
            background: var(--primary); 
            color: white; 
            text-decoration: none; 
            font-weight: 800; 
        }
        
    </style>
</head>
<body>
    <main class="focus-card">
        <div class="focus-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <h1>BuhoWise Current Focus</h1>
        <p>BuhoWise now focuses on Mathematics and Language Arts for third cycle students in El Salvador.</p>
        <a class="btn-main" href="subjects.html">Go to Subjects <i class="bi bi-arrow-right"></i></a>
    </main>
</body>
</html>
