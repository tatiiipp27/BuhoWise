<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Unit | BuhoWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#6b4eff; --primary-dark:#5138db; --light-purple:#f0edff; --dark:#252238; --gray:#8d899c; --bg-light:#fff; --card-border:#e8e4f2; --nav-footer-dark:#1a1824; }
        * { box-sizing:border-box; transition:.25s ease; }
        body { margin:0; font-family:'Nunito',sans-serif; background:var(--bg-light); color:var(--dark); }
        .navbar { background:var(--nav-footer-dark); box-shadow:0 4px 20px rgba(0,0,0,.15); padding:10px 0; }
        .navbar-brand img { height:55px; width:auto; border-radius:8px; background:#fff; padding:2px; }
        .nav-link { font-weight:700; margin:0 10px; position:relative; color:rgba(255,255,255,.85)!important; }
        .nav-link::after { content:''; position:absolute; left:0; bottom:-5px; width:0; height:3px; background:var(--primary); border-radius:10px; }
        .nav-link:hover::after { width:100%; }
        .nav-link:hover { color:#fff!important; }
        .btn-nav-account { background:var(--primary); color:#fff!important; font-weight:800; padding:8px 20px; border-radius:50px; }
        .btn-nav-account:hover { background:var(--primary-dark); transform:translateY(-2px); }
        .hero { padding:76px 0 46px; background:linear-gradient(180deg,var(--light-purple),var(--bg-light)); }
        .breadcrumb-link { color:var(--primary); font-weight:800; text-decoration:none; }
        .hero-badge { display:inline-flex; align-items:center; gap:8px; margin-top:28px; padding:8px 14px; border-radius:999px; background:var(--bg-light); color:var(--primary); font-weight:800; border:1px solid var(--card-border); }
        .page-title { font-size:3rem; font-weight:900; line-height:1.08; margin:18px 0 16px; }
        .page-title span { color:var(--primary); }
        .page-subtitle { max-width:780px; opacity:.78; font-size:1.08rem; line-height:1.8; }
        .section-space { padding:58px 0 86px; }
        .unit-card { display:flex; flex-direction:column; height:100%; padding:30px; border:1px solid var(--card-border); border-radius:22px; background:var(--bg-light); color:var(--dark); box-shadow:0 10px 28px rgba(0,0,0,.04); position:relative; overflow:hidden; }
        .unit-card::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(107,78,255,.10),transparent 58%); }
        .unit-card:hover { transform:translateY(-8px); border-color:var(--primary); box-shadow:0 18px 36px rgba(107,78,255,.16); }
        .unit-card > * { position:relative; }
        .unit-icon { width:70px; height:70px; border-radius:20px; display:inline-flex; align-items:center; justify-content:center; background:var(--primary); color:#fff; font-size:2rem; margin-bottom:20px; box-shadow:0 12px 24px rgba(107,78,255,.22); }
        .unit-card h3 { font-weight:900; }
        .unit-card p { opacity:.76; line-height:1.7; }
        .unit-status,.topic-pill { display:inline-flex; align-items:center; gap:6px; width:fit-content; padding:7px 11px; border-radius:999px; background:var(--light-purple); color:var(--primary); font-weight:800; font-size:.84rem; }
        .unit-status { margin-bottom:14px; }
        .topics { display:flex; flex-wrap:wrap; gap:7px; margin-top:auto; }
        footer { background:var(--nav-footer-dark); color:#aeacb8; padding:52px 0 28px; }
        .accessibility-btn { position:fixed; z-index:999; }
        .accessibility-panel { position:fixed; display:none; z-index:999; background:var(--bg-light); border:1px solid var(--card-border); padding:25px; border-radius:24px; box-shadow:0 15px 40px rgba(0,0,0,.15); }
        .accessibility-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .accessibility-panel button { background:var(--light-purple); color:var(--primary); font-weight:700; border:0; padding:12px; border-radius:14px; }
        .accessibility-panel button:hover { background:var(--primary); color:#fff; }
        .accessibility-panel .btn-reset { grid-column:span 2; background:#ff4e4e; color:#fff; }
        @media(max-width:768px){ .page-title{font-size:2.25rem;} }
    </style>
    <link href="buhowise-fixes.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/BuhoWiselogo.png" alt="BuhoWise Logo"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto text-center align-items-center gap-2 py-3 py-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="subjects.html">Subjects</a></li>
                    <li class="nav-item"><a class="nav-link" href="teacherss.html">Teachers</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0"><a class="btn btn-nav-account" href="#">Create Account</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <section class="hero">
            <div class="container">
                <a class="breadcrumb-link" id="backLink" href="subjects.html"><i class="bi bi-arrow-left"></i> Back to Grades</a>
                <span class="hero-badge" id="heroBadge"></span>
                <h1 class="page-title">Choose a <span>Unit</span></h1>
                <p class="page-subtitle" id="subtitle"></p>
            </div>
        </section>
        <section class="section-space"><div class="container"><div class="row g-4" id="unitGrid"></div></div></section>
    </main>
    <footer><div class="container text-center"><h4 class="text-white">BuhoWise</h4><p>Making education accessible, engaging, and inclusive for every learner in El Salvador. Learning Without Limits.</p></div></footer>
    <button class="accessibility-btn" onclick="toggleAccessibility()" aria-label="Accessibility Menu"><i class="bi bi-universal-access"></i></button>
    <div class="accessibility-panel" id="accessibilityPanel">
        <h5 class="fw-bold mb-3">Accessibility</h5>
        <div class="accessibility-grid">
            <button onclick="toggleFontSize()">Text Size</button><button onclick="toggleContrast()">Contrast</button>
            <button onclick="toggleDarkMode()">Dark Mode</button><button onclick="toggleDyslexiaFont()">Easy Font</button>
            <button class="btn-reset" onclick="resetAccessibility()">Reset</button>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const subject = params.get('subject') === 'language' ? 'language' : 'math';
        const grade = params.get('grade') === '9' ? 9 : 8;
        const data = {
            math: {
                name: 'Mathematics', icon: 'bi-calculator', back: 'math-grades.html',
                units: ['Real Numbers and Operations','Algebraic Expressions','Linear Equations','Functions and Graphs','Geometry and Measurement','Proportional Reasoning','Statistics and Probability','Grade Review and Challenge']
            },
            language: {
                name: 'Language Arts', icon: 'bi-journal-text', back: 'language-grades.html',
                units: ['Reading Comprehension','Narrative and Literary Texts','Informational and Argumentative Texts','Grammar and Sentence Structure','Spelling and Vocabulary','Written Expression','Oral Communication','Text Analysis and Final Review']
            }
        }[subject];
        document.title = `${data.name} ${grade}th Grade Units | BuhoWise`;
        document.getElementById('backLink').href = data.back;
        document.getElementById('heroBadge').innerHTML = `<i class="bi ${data.icon}"></i> ${data.name} - ${grade}th Grade`;
        document.getElementById('subtitle').textContent = `Explore the eight ${grade}th grade ${data.name.toLowerCase()} units. Lesson content can be connected to each unit as it becomes available.`;
        document.getElementById('unitGrid').innerHTML = data.units.map((title,index) => `
            <div class="col-lg-3 col-md-6">
                <article class="unit-card">
                    <span class="unit-status"><i class="bi bi-unlock-fill"></i> Available unit</span>
                    <div class="unit-icon"><strong>${index + 1}</strong></div>
                    <h3>Unit ${index + 1}</h3><p>${title}</p>
                    <div class="topics"><span class="topic-pill">${grade}th grade</span><span class="topic-pill">${data.name}</span></div>
                </article>
            </div>`).join('');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="buhowise-accessibility.js"></script>
</body>
</html>
