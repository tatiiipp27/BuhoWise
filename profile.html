<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Profile | BuhoWise</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="profile.css" rel="stylesheet" />
    <link href="buhowise-fixes.css" rel="stylesheet" />
    <link href="buhowise-avatar.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar"></nav>
    <header class="profile-hero">
      <div class="container">
        <h1>My <span>Profile</span></h1>
        <p>Your avatar, grade, and locally saved BuhoWise learning progress.</p>
      </div>
    </header>
    <main class="profile-main">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-4">
            <section class="profile-card">
              <img
                id="profileAvatar"
                class="profile-avatar"
                src="avatars/avatar-01-classic.png"
                alt="Selected owl avatar"
              />
              <h2 id="profileName">BuhoWise Student</h2>
              <p id="profileGrade" class="profile-grade">Grade not selected</p>
              <button class="change-avatar" type="button" onclick="BuhoWiseAvatar.open()">
                <i class="bi bi-stars me-1"></i>Change Avatar
              </button>
              <form id="profileForm" class="profile-form">
                <label for="studentName">Name or nickname</label
                ><input
                  id="studentName"
                  maxlength="30"
                  placeholder="How should we call you?"
                /><label for="studentGrade">Grade</label
                ><select id="studentGrade">
                  <option value="">Choose your grade</option>
                  <option value="7">7th Grade</option>
                  <option value="8">8th Grade</option>
                  <option value="9">9th Grade</option></select
                ><button class="save-profile" type="submit">Save Profile</button>
                <p id="saveMessage" class="save-message" aria-live="polite"></p>
              </form>
            </section>
          </div>
          <div class="col-lg-8">
            <section class="stats-card">
              <h2><i class="bi bi-bar-chart-fill text-primary me-2"></i>Learning Progress</h2>
              <div class="stats-grid">
                <div class="stat-box">
                  <strong id="completedTotal">0</strong><span>Completed</span>
                </div>
                <div class="stat-box"><strong>160</strong><span>Available quizzes</span></div>
                <div class="stat-box">
                  <strong id="overallPercent">0%</strong><span>Total progress</span>
                </div>
              </div>
              <div class="subject-progress">
                <div class="subject-row">
                  <div class="subject-label">
                    <span>Mathematics</span><span id="mathCount">0 / 96</span>
                  </div>
                  <div class="progress-track"><div id="mathBar" class="progress-fill"></div></div>
                </div>
                <div class="subject-row">
                  <div class="subject-label">
                    <span>Language Arts</span><span id="languageCount">0 / 64</span>
                  </div>
                  <div class="progress-track">
                    <div id="languageBar" class="progress-fill"></div>
                  </div>
                </div>
              </div>
            </section>
            <section class="stats-card">
              <h2><i class="bi bi-check2-circle text-primary me-2"></i>Recent Completions</h2>
              <div id="recentProgress"></div>
            </section>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <button class="accessibility-btn"></button>
    <div id="accessibilityPanel"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="buhowise-accessibility.js"></script>
    <script src="buhowise-shell.js"></script>
    <script src="buhowise-avatar.js"></script>
    <script>
      (function () {
        const pk = "buhowiseStudentProfile",
          rk = "buhowiseCompletedLessons",
          af = {
            classic: "avatar-01-classic.png",
            mathematics: "avatar-02-mathematics.png",
            reading: "avatar-03-reading.png",
            science: "avatar-04-science.png",
            technology: "avatar-05-technology.png",
            artist: "avatar-06-artist.png",
            explorer: "avatar-07-explorer.png",
            sports: "avatar-08-sports.png",
          };
        function obj(k) {
          try {
            return JSON.parse(localStorage.getItem(k) || "{}") || {};
          } catch (e) {
            return {};
          }
        }
        function profile() {
          const d = obj(pk),
            a = localStorage.getItem("buhowiseSelectedAvatar") || "classic";
          studentName.value = d.name || "";
          studentGrade.value = d.grade || "";
          profileName.textContent = d.name || "BuhoWise Student";
          profileGrade.textContent = d.grade ? d.grade + "th Grade" : "Grade not selected";
          profileAvatar.src = "avatars/" + (af[a] || af.classic);
        }
        function label(k) {
          return decodeURIComponent(k)
            .split("/")
            .pop()
            .replace(".html", "")
            .replace(/[-_]/g, " ")
            .replace(/\b(u|unidad)(\d+)/gi, "Unit $2 ")
            .replace(/\b(l|leccion)(\d+)/gi, "Lesson $2")
            .replace(/\s+/g, " ")
            .trim();
        }
        function progress() {
          const it = Object.entries(obj(rk)).filter(([, v]) => v && v.completed),
            m = it.filter(([k]) => /\/lessons(?:\/|_8math|_9math)/.test(k)).length,
            l = it.filter(([k]) => /lessons_(?:8|9)languaje/.test(k)).length;
          completedTotal.textContent = it.length;
          overallPercent.textContent = Math.min(100, Math.round((it.length / 160) * 100)) + "%";
          mathCount.textContent = m + " / 96";
          languageCount.textContent = l + " / 64";
          mathBar.style.width = (m / 96) * 100 + "%";
          languageBar.style.width = (l / 64) * 100 + "%";
          const recent = it
            .sort((a, b) => new Date(b[1].completedAt || 0) - new Date(a[1].completedAt || 0))
            .slice(0, 6);
          recentProgress.innerHTML = recent.length
            ? '<ul class="recent-list">' +
              recent
                .map(
                  ([k, v]) =>
                    '<li><i class="bi bi-check-lg"></i><div><strong>' +
                    label(k) +
                    '</strong><small class="d-block text-muted">' +
                    new Date(v.completedAt || Date.now()).toLocaleDateString("en-US") +
                    "</small></div></li>",
                )
                .join("") +
              "</ul>"
            : '<div class="empty-progress">Complete a quiz and it will appear here.</div>';
        }
        profileForm.addEventListener("submit", (e) => {
          e.preventDefault();
          localStorage.setItem(
            pk,
            JSON.stringify({ name: studentName.value.trim(), grade: studentGrade.value }),
          );
          profile();
          saveMessage.textContent = "Profile saved!";
        });
        addEventListener("buhowise:avatar-changed", profile);
        profile();
        progress();
      })();
    </script>
  </body>
</html>
